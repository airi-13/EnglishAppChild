# えいご道場（Cloudflare Workers + D1）
name = "english-app-child"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 画面（public/ の中身）を配信する。/api/ だけは、先にWorkerが処理する
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# データベース（D1）。database_id は、作成したD1のIDに置き換える（docs/deploy.md 参照）
[[d1_databases]]
binding = "DB"
database_name = "english-app-child"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 設定（秘密ではないもの）。秘密の GEMINI_API_KEY と SETUP_TOKEN は、ダッシュボードで「シークレット」として登録する
[vars]
AI_MODE = "gemini"
GEMINI_MODEL = "gemini-flash-latest"
AI_TIMEOUT_MS = "25000"
AI_MAX_RETRIES = "2"
COOKIE_SECURE = "1"
SESSION_DAYS = "30"
TZ_OFFSET_HOURS = "9"
PBKDF2_ITERS = "30000"
